[project]
name = "pysenscritique"
version = "0.1.0"
description = "Async Python client library for SensCritique (GraphQL)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "baptiste.bonnaudet", email = "baptiste.bonnaudet@gmail.com" },
]
keywords = ["senscritique", "graphql", "client", "movies", "tv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-json-logger>=3.1",
]

[project.urls]
Homepage = "https://github.com/"
Repository = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysenscritique"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pysenscritique --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (hit the live SensCritique API)",
]

[tool.coverage.run]
source = ["pysenscritique"]
branch = true
